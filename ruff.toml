line-length = 79
target-version = "py311"
exclude = [".venv", "migrations", "__pycache__"]

[lint]
# Errores de Python, referencias muertas y orden de imports.
select = ["E4", "E7", "E9", "F", "I"]

[lint.per-file-ignores]
# Los módulos __init__ reexportan símbolos para el resto de la app.
"app/**/__init__.py" = ["F401"]
